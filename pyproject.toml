readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "huggingface-hub>=2.4.0",
    "openpyxl>=3.1.5",
    "pyarrow>=26.0.0",
    "pymupdf>=1.26,<2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "requests>=2.34.2",
]

[tool.uv]
package = false
